# Render Blueprint — Sourcely production deployment
#
# Deploy: Render Dashboard → New → Blueprint → select this repository.
# Render provisions everything below and prompts once for the values marked
# `sync: false` (set NEXT_PUBLIC_APP_URL to the final https:// URL — it is
# inlined at build time, so it must be present before the first build).
#
# After the first deploy, seed the database once from the service Shell:
#   npm run db:seed
# (Migrations run automatically before every deploy via preDeployCommand.)

services:
  - type: web
    name: sourcely
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /
    # Admin-uploaded product images persist here (served via /api/media).
    # The catalogue's 63 photographs live in public/ and ship with the build.
    disk:
      name: sourcely-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Generated by Render — a fresh production signing key that never
      # existed in the repository, the dashboard history, or a chat log.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUDIT_IP_SALT
        generateValue: true
      - key: AUTH_SESSION_TTL_HOURS
        value: "72"
      - key: DATA_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sourcely-db
          property: connectionString
      # The final public URL (https://sourcely.onrender.com or your custom
      # domain). Prompted at blueprint creation; rebuild after changing it.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Optional integrations (add later via the dashboard when wanted):
      #   AI_PROVIDER=claude + ANTHROPIC_API_KEY   — Claude-written prose
      #   RESEND_API_KEY or SMTP_URL + MAIL_FROM   — real password-reset mail
      #   REDIS_URL                                 — only for >1 instance
      #   NEXT_PUBLIC_CONTACT_* / address vars      — public site details

databases:
  - name: sourcely-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
